<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a1887f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8d6e63;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Ears (Folded) -->
  <path d="M15,45 Q10,25 35,35" fill="#6d4c41"/>
  <path d="M85,45 Q90,25 65,35" fill="#6d4c41"/>
  <!-- Head -->
  <circle cx="50" cy="55" r="42" fill="url(#fur)"/>
  <!-- Stripes -->
  <path d="M50,15 L50,30 M30,20 L35,32 M70,20 L65,32" stroke="#4e342e" stroke-width="4" stroke-linecap="round"/>
  <path d="M10,55 L25,55 M90,55 L75,55" stroke="#4e342e" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Eyes -->
  <circle cx="35" cy="55" r="10" fill="#3e2723"/>
  <circle cx="65" cy="55" r="10" fill="#3e2723"/>
  <circle cx="32" cy="52" r="3" fill="white"/>
  <circle cx="62" cy="52" r="3" fill="white"/>
  <!-- Mouth/Nose -->
  <ellipse cx="50" cy="66" rx="5" ry="3" fill="#3e2723"/>
  <path d="M42,76 Q50,82 58,76" fill="none" stroke="#3e2723" stroke-width="3" stroke-linecap="round"/>
  <!-- Pompoms (Cheerleading) -->
  <circle cx="15" cy="80" r="15" fill="#ffcc80" stroke="#f57c00" stroke-width="2" stroke-dasharray="4,2"/>
  <circle cx="85" cy="80" r="15" fill="#ffcc80" stroke="#f57c00" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Text -->
  <text x="50" y="20" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle" fill="#3e2723">加油</text>
</svg>
